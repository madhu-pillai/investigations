name: "Build and push fedora-coreos images"

env:
  REGISTRY: "quay.io/trusted-execution-clusters"

on:
  push:
    branches:
      - main
    paths:
      - "coreos/**"
      - ".github/workflows/build-fcos-images.yml"
  pull_request:
    branches:
      - main
    paths:
      - "coreos/**"
      - ".github/workflows/build-fcos-images.yml"
  schedule:
    - cron: "0 0 * * MON"
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push container images to registry"
        required: false
        default: false
        type: boolean

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-fcos-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install just
        run: curl -sSf https://just.systems/install.sh | sudo bash -s -- --to /usr/local/bin

      - name: Build custom FCOS container image
        working-directory: coreos
        run: |
          mkdir -p cache 
          sudo chown -R 1000:1000 cache
          sudo -E env PATH=$PATH just build

      - name: Push FCOS container image
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || inputs.push_image))
        working-directory: coreos
        run: |
          FCOS_IMG=$(find cache/builds/latest/x86_64 -name "*-ostree.*.ociarchive" | head -1)
          if [ -z "${FCOS_IMG}" ]; then
            echo "No FCOS ostree image found"
            find cache/builds/ -type f || true
            exit 1
          fi
          echo "Found: ${FCOS_IMG}"
          skopeo copy oci-archive:${FCOS_IMG} \
            docker://${{ env.REGISTRY }}/fedora-coreos:latest \
            --dest-creds ${{ secrets.REGISTRY_USERNAME }}:${{ secrets.REGISTRY_PASSWORD }}

      - name: Build kubevirt disk image
        working-directory: coreos
        run: |
          sudo chown -R 1000:1000 cache
          sudo -E env PATH=$PATH just kubevirt

      - name: Push kubevirt image to registry
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || inputs.push_image))
        working-directory: coreos
        run: |
          KUBEVIRT_IMG=$(find cache/builds/latest/x86_64 -name "*-kubevirt.*.ociarchive" | head -1)
          if [ -z "${KUBEVIRT_IMG}" ]; then
            echo "No kubevirt image found"
            find cache/builds/ -type f || true
            exit 1
          fi
          echo "Found: ${KUBEVIRT_IMG}"
          DATE_TAG=$(date +%Y%m%d)
          skopeo copy oci-archive:${KUBEVIRT_IMG} \
            docker://${{ env.REGISTRY }}/fedora-coreos-kubevirt:${DATE_TAG} \
            --dest-creds ${{ secrets.REGISTRY_USERNAME }}:${{ secrets.REGISTRY_PASSWORD }}
